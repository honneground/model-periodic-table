  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #1e1f20;
      --bg-input: #1e1f20;
      --bg-cell-default: #1e2024;
      --bg-panel: #1e1f20;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.04);
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --text-muted: #8e918f;
      --bard-color-lm-glow-chat: #1f3b9b;
      --bard-color-lm-glow-task: #3631a5;
      --bard-color-lm-glow-bloom: #000000;
      --gem-sys-shape--corner-extra-large-increased: 32px;
      --font-sans: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: #000000;
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Main Ambient Stage & Mode-Aware Glow */
        .stage {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      isolation: isolate;
      background-color: #000000;
    }

    /* =========================================================================
       Ambient Glow System (Faithful to Google Full & Split-screen Specs)
       ========================================================================= */
    @keyframes glowEnter {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: clip;
      animation: glowEnter 1300ms cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    /* Atmospheric diffusion backdrop layers for seamless crossfade between Chat and Task */
    .ambient-glow-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 900ms cubic-bezier(0.2, 0, 0, 1);
    }

    /* Chat Mode Backdrop: Peak centered at 58% 64% with deep navy blue (#142769 / #1f3b9b) */
    .ambient-backdrop-chat {
      background: radial-gradient(
        ellipse 58vw 46vh at 58% 64%,
        rgba(26, 50, 138, 0.48) 0%,
        rgba(16, 32, 88, 0.28) 40%,
        rgba(8, 16, 48, 0.08) 72%,
        transparent 100%
      );
    }

    /* Task Mode Backdrop: Peak centered at 54% 58% with saturated indigo (#3631a5 / #333693) */
    .ambient-backdrop-task {
      background: radial-gradient(
        ellipse 62vw 48vh at 54% 58%,
        rgba(46, 42, 142, 0.50) 0%,
        rgba(28, 24, 96, 0.30) 40%,
        rgba(10, 8, 42, 0.10) 72%,
        transparent 100%
      );
    }

    .ambient-glow.is-chat .ambient-backdrop-chat {
      opacity: 1;
    }

    .ambient-glow.is-task .ambient-backdrop-task {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow-backdrop,
      .ambient-glow-layer {
        transition: none;
      }
    }

    /* =========================================================================
       Core Layout & Responsive Container
       ========================================================================= */
    .main-container {
      position: relative;
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lower-content {
      display: contents;
    }

    /* 1. Greeting Wrapper & Sparkle */
    .greeting-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      order: 1;
      margin-bottom: 28px;
    }

    .greeting-sparkle {
      display: none;
    }

    .greeting {
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text-primary);
      text-align: center;
      margin: 0;
      user-select: none;
    }

    /* 2. Prompt Bar Wrapper */
    .prompt-anchor {
      position: relative;
      width: 100%;
      max-width: 660px;
      z-index: 30;
      order: 2;
    }

    .prompt-bar {
      width: 100%;
      min-height: 56px;
      border-radius: var(--gem-sys-shape--corner-extra-large-increased);
      background-color: var(--bg-input);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 6px;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.16);
      transition: background-color 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .prompt-bar:focus-within {
      background-color: #1e1f20;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.32);
    }

    .icon-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .icon-circle-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .icon-circle-btn.is-open {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.08);
    }

    .plus-to-close {
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center;
    }

    .icon-circle-btn.is-open .plus-to-close {
      transform: rotate(45deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .plus-to-close { transition: none; }
    }

    .icon-circle-btn.is-listening {
      color: #60A5FA;
      background-color: rgba(59, 130, 246, 0.16);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25);
    }

    /* Active Tool Chip inside Prompt Bar (Music, Image, Video, etc.) */
    .active-tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 6px 0 12px;
      margin-right: 4px;
      border-radius: 9999px;
      background-color: #383B40;
      color: #E8EAED;
      font-family: 'Google Sans', 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
      box-sizing: border-box;
      animation: chipEnter 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes chipEnter {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .active-tool-chip svg {
      color: #E8EAED;
      flex-shrink: 0;
    }

    .active-tool-clear {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin-left: 2px;
      flex-shrink: 0;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .active-tool-clear:hover {
      transform: scale(1.08);
      opacity: 0.92;
    }

    .active-tool-clear svg {
      color: #000000 !important;
      stroke: #000000 !important;
      stroke-width: 2.8 !important;
      width: 10px;
      height: 10px;
    }

    .prompt-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      color: var(--text-primary);
      padding: 0 8px;
    }

    .prompt-input::placeholder {
      color: #8e918f;
      font-size: 16px;
    }

    .prompt-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .model-trigger {
      height: 36px;
      padding: 0 13px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      background-color: transparent;
      border: 1px solid transparent;
      transition: background-color 150ms ease, border-color 150ms ease;
      white-space: nowrap;
    }

    .model-trigger:hover,
    .model-trigger.is-open {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .model-trigger-level {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .model-trigger .chevron {
      color: var(--text-secondary);
      margin-left: 1px;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .model-trigger.is-open .chevron {
      transform: rotate(180deg);
    }

    .coming-soon-ring {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* Prompt Bar Hover Tooltips */
    .tooltip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .bar-tooltip {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(-2px);
      padding: 8px 14px;
      border-radius: 9999px;
      background-color: #E3E5E8;
      color: #1A1C20;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.005em;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease, transform 120ms ease;
      z-index: 48;
    }

    .bar-tooltip.is-right-aligned {
      left: auto;
      right: -4px;
      transform: translateY(-2px);
    }

    .tooltip-wrap:hover .bar-tooltip,
    .tooltip-wrap:focus-within .bar-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .tooltip-wrap:hover .bar-tooltip.is-right-aligned,
    .tooltip-wrap:focus-within .bar-tooltip.is-right-aligned {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dismiss hover tooltips immediately when clicked or active */
    .tooltip-wrap:active .bar-tooltip,
    .tooltip-wrap:has(:active) .bar-tooltip,
    .tooltip-wrap.is-suppressed .bar-tooltip,
    .model-trigger.is-open + .bar-tooltip,
    .model-trigger.is-open ~ .bar-tooltip {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* 3. Mode Switcher (Chat / Task Segmented Control) */
    .segmented-control {
      margin-top: 16px;
      display: inline-flex;
      position: relative;
      border-radius: 9999px;
      padding: 1.5px;
      background: transparent;
      isolation: isolate;
      order: 3;
    }

    .segmented-slider {
      position: absolute;
      top: 1.5px;
      bottom: 1.5px;
      left: 1.5px;
      width: calc(50% - 1.5px);
      border-radius: 9999px;
      background-color: #333537;
      box-shadow: 0 0 0 1px hsla(0, 0%, 100%, 0.12);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 0;
    }

    .segmented-control.is-chat .segmented-slider {
      transform: translateX(0);
    }

    .segmented-control.is-task .segmented-slider {
      transform: translateX(100%);
    }

    .segment-btn {
      position: relative;
      z-index: 1;
      height: 28px;
      padding: 0 12px;
      border-radius: 9999px;
      font-family: 'Google Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: #c4c7c5;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 200ms ease;
    }

    .segment-btn:hover:not(.is-active) {
      color: #e3e3e3;
    }

    .segment-btn.is-active {
      color: #ffffff;
    }

    /* 4. Suggested Prompts */
    .suggested-list {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      order: 4;
    }

    .suggested-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: 'Google Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    .suggested-item svg {
      flex-shrink: 0;
      color: var(--text-secondary);
    }

    .suggested-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* 5. Periodic Table Floating Panel */
    .periodic-panel {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 940px;
      max-width: calc(100vw - 24px);
      background-color: var(--bg-panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 20px 18px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      z-index: 40;
      overflow: visible;
      animation: panelEnter 190ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes panelEnter {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-6px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .panel-sparkle {
      color: #D2E3FC;
    }

    .panel-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 150ms ease, color 150ms ease;
    }

    .panel-close-btn:hover {
      background-color: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
    }

    /* Periodic Grid */
    .periodic-grid-scroll {
      width: 100%;
    }

    .periodic-grid {
      display: grid;
      /* Col 1 for period numbers, Cols 2..19 for Groups 1..18 */
      grid-template-columns: 18px repeat(18, minmax(0, 1fr));
      /* Row 1: group numbers, Rows 2..8: periods 1..7, Row 9: spacer, Rows 10..11: La/Ac */
      grid-template-rows: 16px repeat(7, minmax(0, 1fr)) 10px repeat(2, minmax(0, 1fr));
      gap: 4px;
      align-items: stretch;
      user-select: none;
    }

    .group-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: #7C828A;
      line-height: 1;
    }

    .period-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: #7C828A;
      line-height: 1;
    }

    .dot-ring {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Lanthanide / actinide row labels */
    .series-label {
      grid-column: 2 / 5;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: default;
      transition: color 140ms ease;
    }

    .series-label:hover {
      color: var(--text-secondary);
    }

    /* Element Cells */
    .el-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--bg-cell-default);
      border: 1px solid rgba(255, 255, 255, 0.075);
      transition:
        border-color 120ms ease,
        background-color 120ms ease,
        transform 120ms ease,
        box-shadow 120ms ease;
      text-align: left;
    }

    .el-cell:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 1px;
    }

    .el-cell .el-num {
      font-size: 9.5px;
      line-height: 1;
      font-weight: 500;

    .panel-search {

    /* Released Elements (H, C, Ar) */
    .el-cell.is-released .el-num {

    .el-cell.is-released .el-sym {
      color: #FFFFFF;
    }

    .el-cell.is-released:hover,
    .el-cell.is-released.is-hovered {
      transform: translateY(-1px);
      z-index: 2;
    }

    /* Range Placeholders (57-71, 89-103) */
    .el-range-marker {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      background-color: rgba(255, 255, 255, 0.02);

      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 500;
      color: #80868E;
      letter-spacing: -0.02em;
      cursor: default;
      transition: border-color 140ms ease, color 140ms ease;

    .el-range-marker:hover {
      border-color: rgba(255, 255, 255, 0.32);
      color: var(--text-secondary);

    /* Footer: currently selected model */
    .panel-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .footer-model {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-primary);

    .footer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;

    .footer-meta {
      font-size: 12.5px;
      color: var(--text-secondary);

    /* Hover popover = light preview (no interaction); click popover = full card */
    .element-popover {
      transition: border-color 220ms ease, box-shadow 220ms ease;
    }

    .element-popover.is-preview {
      pointer-events: none;
    }

    .element-popover.is-pinned {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow:
        0 22px 52px rgba(0, 0, 0, 0.78),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    /* Thinking level expands smoothly when a hover preview becomes a clicked card */
    .thinking-wrap {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition:
        grid-template-rows 240ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 180ms ease,
        visibility 0s linear 240ms;
    }

    .is-pinned .thinking-wrap {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: inherit;
      transition:
        grid-template-rows 260ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 220ms ease 40ms,
        visibility 0s;
    }

    .thinking-clip {
      min-height: 0;
      overflow: hidden;
    }

    /* Element Hover / Detail Popover Card */
    .element-popover {
      position: absolute;
      z-index: 60;
      border-radius: 12px;
      background-color: #1B1D24;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 12px;
      animation: popoverFade 130ms cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    /* Invisible bridge below card so cursor can glide from cell to card */
    .element-popover::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 12px;
    }

    .element-popover.is-below::after {
      top: auto;
      bottom: 100%;
    }

    .element-popover.is-below .popover-caret {
      bottom: auto;
      top: -5px;
      transform: translateX(-50%) rotate(225deg);
    }

    @keyframes popoverFade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }

    .popover-caret {
      position: absolute;
      bottom: -5px;
      width: 9px;
      height: 9px;
      background-color: #1B1D24;
      border-right: 1px solid rgba(255, 255, 255, 0.14);

      transform: translateX(-50%) rotate(45deg);
      pointer-events: none;

    .popover-released {
      width: 262px;

    .popover-coming-soon {

    .popover-tile {

    .thinking-section {

    /* Segmented control: one pill-shaped track holding the three options */
    .thinking-pills {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;

      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);

    /* Sliding highlight: each step = one option width + the 2px gap */
    .thinking-indicator {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px - 4px) / 3);
      border-radius: 9999px;
      border: 1px solid transparent;
      transform: translateX(calc(var(--idx, 0) * (100% + 2px)));
      transition:
        transform 260ms cubic-bezier(0.16, 1, 0.3, 1),
        background-color 200ms ease,
        border-color 200ms ease,
        box-shadow 200ms ease;
      pointer-events: none;

    .thinking-pill {

      z-index: 1;

    .thinking-pill.is-active {
      color: #FFFFFF;

    @media (prefers-reduced-motion: reduce) {
      .thinking-indicator { transition: none; }

    .prototype-toast {

    @keyframes toastSlideUp {

    @media (max-width: 780px) {
      .periodic-panel {

    @media (max-width: 600px) {

    /* Left Action Popover Menu */
    .left-menu {

    .left-menu-item svg {

    .left-menu-item.is-active svg {

    .left-menu-sub {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.2;

    .left-menu-chevron.is-open {

      box-shadow: none !important;

      animation: menuEnter 130ms cubic-bezier(0.16, 1, 0.3, 1);

    /* Invisible hover bridge between left-menu and left-submenu */
    .left-submenu::before {
      content: '';
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: -12px;
      width: 14px;
    }

    /* Top Header Bar (Split-Screen / Mobile only) */
    .top-header {
      display: none;
    }

    .top-header-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #E8EAED;
      cursor: pointer;
      transition: background-color 150ms ease;

    .top-header-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);

    /* Material-style Pill Switch */
    .labs-switch {
      position: relative;

      height: 24px;
      border-radius: 9999px;

      align-items: center;
      justify-content: center;
      color: #D3E3FD;
      transition:
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),

        height 180ms ease,
        background-color 180ms ease;

    .labs-switch.is-on .labs-switch-thumb {
      width: 18px;
      height: 18px;
      background-color: #062E6F;
      transform: translate(17px, -50%);
    }
      /* =========================================================================

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useLayoutEffect, useCallback } = React;

        <path d="M3.5 7.5A4.5 4.5 0 0 1 12 8.5a4.5 4.5 0 0 1 8.5-1V18a4.5 4.5 0 0 0-8.5 1 4.5 4.5 0 0 0-8.5-1V7.5Z" />

    const PersonalIntelIcon = () => (

        <path d="M18 13.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="currentColor" stroke="none" />

    const CheckSmallIcon = () => (

        <path d="M3.5 8.5l3 3 6-6.5" />
      </svg>
    );

    const TOOL_SHORT_LABELS = {
      'Create image': 'Image',
      'Create video': 'Video',
      'Create music': 'Music',
      'Canvas': 'Canvas',
      'Deep research': 'Deep research',
      'Guided learning': 'Guided learning',
    };

    const ToolIcon = ({ tool }) => {
      switch (tool) {
        case 'Create image': return <FruitImageIcon size={16} />;
        case 'Create video': return <VideoSlateIcon size={16} />;
        case 'Create music': return <MusicNoteIcon size={16} />;
        case 'Canvas': return <CanvasIcon size={16} />;
        case 'Deep research': return <DeepResearchIcon size={16} />;
        case 'Guided learning': return <GuidedLearningIcon size={16} />;
        default: return null;

    // -------------------------------------------------------------------------
    // 4. Element Detail / Preview Popover Card Component
    // -------------------------------------------------------------------------
    function ElementPopover({
      mode = 'hover', // 'hover' = light preview, 'pinned' = full card opened by click
      element,
      releaseInfo,
      thinkingLevel,
      panelRef,
      getCellEl, // read lazily: the cell ref may not exist yet when this renders
      onSelectThinkingLevel,
    }) {
      const popoverRef = useRef(null);
      const [coords, setCoords] = useState({ left: 0, bottom: 0, top: 0, below: false, arrowLeft: 24, visible: false });

      useLayoutEffect(() => {
        const updatePosition = () => {
          const panelEl = panelRef.current;
          const popEl = popoverRef.current;
          const cellEl = getCellEl();
          if (!panelEl || !cellEl || !popEl || !element) return;

          const panelRect = panelEl.getBoundingClientRect();
          const cellRect = cellEl.getBoundingClientRect();
          const cardWidth = popEl.offsetWidth;

          const cellLeft = cellRect.left - panelRect.left;
          const cellRight = cellRect.right - panelRect.left;
          const cellCenterX = cellLeft + cellRect.width / 2;
          const cellTop = cellRect.top - panelRect.top;

          const safeMargin = 14;
          let left;

          if (element.col <= 3) {
            // Left-edge collision guard: expand rightward aligned with cell left
            left = cellLeft;
          } else if (element.col >= 15) {
            // Right-edge collision guard: expand leftward aligned with cell right
            left = cellRight - cardWidth;
          } else {
            // Centered above cell
            left = cellCenterX - cardWidth / 2;
          }

          // Strict panel horizontal clamping
          left = Math.max(safeMargin, Math.min(panelRect.width - cardWidth - safeMargin, left));
          const arrowLeft = Math.max(14, Math.min(cardWidth - 14, cellCenterX - left));
          const bottom = panelRect.height - cellTop + 8;
          // Top rows: open below the cell so the card never covers the prompt bar
          const below = element.row <= 2 && element.row < 9;
          const top = cellRect.bottom - panelRect.top + 8;

          setCoords({ left, bottom, top, below, arrowLeft, visible: true });
        };

        updatePosition();
        window.addEventListener('resize', updatePosition);
        return () => window.removeEventListener('resize', updatePosition);
      // getCellEl is a fresh closure each render; keying on it would re-run this every render
      }, [element, panelRef, releaseInfo]);

      if (!element) return null;

      const isReleased = Boolean(releaseInfo);

      return (
        <div
          ref={popoverRef}
          className={`element-popover ${isReleased ? 'popover-released' : 'popover-coming-soon'} ${mode === 'hover' ? 'is-preview' : 'is-pinned'} ${coords.below ? 'is-below' : ''}`}
          style={{
            left: `${coords.left}px`,
            ...(coords.below ? { top: `${coords.top}px` } : { bottom: `${coords.bottom}px` }),
            visibility: coords.visible ? 'visible' : 'hidden',
          }}
          onMouseDown={(e) => e.preventDefault()}
          onClick={(e) => e.stopPropagation()}
        >
          <div className="popover-head">
            <div
              className="popover-tile"
              style={
                isReleased
                  ? {
                      backgroundColor: releaseInfo.themeColor,
                      borderColor: releaseInfo.borderColor,
                    }
                  : undefined
              }
            >
              <span className="popover-tile-num">{element.number}</span>
              <span className="popover-tile-sym">{element.symbol}</span>
            </div>

            <div className="popover-meta">
              <div className="popover-title">
                {isReleased ? releaseInfo.fullName : element.name}
              </div>
              <div className="popover-subtitle">
                {isReleased ? releaseInfo.subtitle : 'Coming soon'}
              </div>
            </div>
          </div>

          {isReleased && (
            <div className="thinking-wrap"><div className="thinking-clip">
            <div className="thinking-section">
              <div className="thinking-label">Thinking level</div>
              <div className="thinking-pills" role="group" aria-label="Thinking level">
                {/* One highlight that slides to the active option instead of jumping */}
                <span
                  className="thinking-indicator"
                  aria-hidden="true"
                  style={{
                    '--idx': Math.max(0, THINKING_LEVELS.indexOf(thinkingLevel)),
                    backgroundColor: releaseInfo.activeBg,
                    borderColor: releaseInfo.activeBorder,
                    boxShadow: `0 0 12px ${releaseInfo.glowColor}`,
                  }}
                />
                {THINKING_LEVELS.map((level) => {
                  const isActive = thinkingLevel === level;
                  return (
                    <button
                      key={level}
                      type="button"
                      aria-pressed={isActive}
                      className={`thinking-pill ${isActive ? 'is-active' : ''}`}
                      onClick={() => onSelectThinkingLevel(element.number, level)}
                    >
                      {level}
                    </button>
                  );
                })}
              </div>
            </div>
            </div></div>
          )}

          <div
            className="popover-caret"
            style={{ left: `${coords.arrowLeft}px` }}
          />
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 5. Main Application
    // -------------------------------------------------------------------------
    const LEFT_MENU_TOOLS = [
      { id: 'Create image', label: 'Create image', icon: <FruitImageIcon /> },
      { id: 'Create video', label: 'Create video', icon: <VideoSlateIcon /> },
      { id: 'Create music', label: 'Create music', icon: <MusicNoteIcon /> },
      { id: 'Canvas', label: 'Canvas', icon: <CanvasIcon /> },
      { id: 'Deep research', label: 'Deep research', icon: <DeepResearchIcon /> },
      { id: 'Guided learning', label: 'Guided learning', icon: <GuidedLearningIcon /> },
    ];

    const MORE_UPLOAD_OPTIONS = [
      { id: 'Import code', label: 'Import code' },
      { id: 'Add from URL', label: 'Add from URL' },
      { id: 'Paste snippet', label: 'Paste snippet' },
    ];

    function App() {
      const [isSplitScreen, setIsSplitScreen] = useState(() => typeof window !== 'undefined' && window.innerWidth <= 980);
      const [isTableOpen, setIsTableOpen] = useState(false);
      const [isLeftMenuOpen, setIsLeftMenuOpen] = useState(false);
      const [isMoreUploadsOpen, setIsMoreUploadsOpen] = useState(false);
      const [activeTool, setActiveTool] = useState(null);
      const [personalIntel, setPersonalIntel] = useState(true);
      const [thinkingLevels, setThinkingLevels] = useState({
        1: ALL_RELEASED_MODELS[1].defaultThinkingLevel,   // H -> Medium
        6: ALL_RELEASED_MODELS[6].defaultThinkingLevel,   // C -> Low
        8: ALL_RELEASED_MODELS[8].defaultThinkingLevel,   // O -> Low
        10: ALL_RELEASED_MODELS[10].defaultThinkingLevel, // Ne -> Medium
        18: ALL_RELEASED_MODELS[18].defaultThinkingLevel, // Ar -> Low
        36: ALL_RELEASED_MODELS[36].defaultThinkingLevel, // Kr -> High
      });
      const [modeModels, setModeModels] = useState({
        Chat: { type: 'element', number: 1 },  // Hydrogen
        Task: { type: 'element', number: 10 }, // Neon
      });
      const [activeMode, setActiveMode] = useState('Chat');
      const currentReleasedModels = MODE_RELEASED_MODELS[activeMode] || CHAT_RELEASED_MODELS;
      const selectedModel = modeModels[activeMode] || modeModels.Chat;
      const setSelectedModel = useCallback((modelOrUpdater) => {
        setModeModels((prev) => {
          const current = prev[activeMode] || { type: 'element', number: 1 };
          const next = typeof modelOrUpdater === 'function' ? modelOrUpdater(current) : modelOrUpdater;
          return {
            ...prev,
            [activeMode]: next,
          };
        });
      }, [activeMode]);
      const [promptText, setPromptText] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [toast, setToast] = useState(null);

      // Popover tracking state
      const [hoveredElementNum, setHoveredElementNum] = useState(null);
      const [pinnedElementNum, setPinnedElementNum] = useState(null);
      const [hoveredSeries, setHoveredSeries] = useState(null); // 'lanthanides' | 'actinides' | null
      const [query, setQuery] = useState('');
      const q = query.trim().toLowerCase();
      const matchesQuery = (el) =>
        !q ||
        el.symbol.toLowerCase().includes(q) ||
        el.name.toLowerCase().includes(q) ||
        String(el.number) === q;

      const topHeaderRef = useRef(null);
      const anchorRef = useRef(null);
      const panelRef = useRef(null);
      const inputRef = useRef(null);
      const fileInputRef = useRef(null);
      const cellRefs = useRef({});
      const hoverCloseTimer = useRef(null);
      const toastTimer = useRef(null);

      const showToast = useCallback((message) => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        setToast(message);
        toastTimer.current = setTimeout(() => setToast(null), 2600);
      }, []);

      // Derive trigger button display info (show thinking level whenever not Low)
      const triggerDisplay = (() => {
        const el = ELEMENTS_BY_NUMBER[selectedModel.number];
        const isReleased = Boolean(currentReleasedModels[selectedModel.number]);
        const level = isReleased ? thinkingLevels[selectedModel.number] : null;
        return {
          label: el ? el.name : 'Hydrogen',
          thinkingLabel: level && level !== 'Low' ? level : null,
          isComingSoon: !isReleased,
        };
      })();

      // A clicked (pinned) card takes priority: hovering other cells shows no preview while it is open
      const activePopoverNum = pinnedElementNum ?? hoveredElementNum;

      // Close open menus/panels when clicking outside or pressing Escape
      useEffect(() => {
        if (!isTableOpen && !isLeftMenuOpen) return;

        const handleOutsideClick = (e) => {
          const inAnchor = anchorRef.current && anchorRef.current.contains(e.target);
          const inTopHeader = topHeaderRef.current && topHeaderRef.current.contains(e.target);
          const inPanel = panelRef.current && panelRef.current.contains(e.target);
          if (!inAnchor && !inTopHeader && !inPanel) {
            setIsTableOpen(false);
            setIsLeftMenuOpen(false);
            setIsMoreUploadsOpen(false);
            setHoveredElementNum(null);
            setPinnedElementNum(null);
          }
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (isLeftMenuOpen) {
              if (isMoreUploadsOpen) {
                setIsMoreUploadsOpen(false);
              } else {
                setIsLeftMenuOpen(false);
              }
            } else if (activePopoverNum) {
              setHoveredElementNum(null);
              setPinnedElementNum(null);
            } else {
              setIsTableOpen(false);
            }
          }
        };

        document.addEventListener('mousedown', handleOutsideClick);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('mousedown', handleOutsideClick);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [isTableOpen, isLeftMenuOpen, isMoreUploadsOpen, activePopoverNum]);

      // Re-trigger ambient glow bloom when switching between full-screen and half-screen
      useEffect(() => {
        let prev = window.innerWidth <= 980;
        const handleResize = () => {
          const current = window.innerWidth <= 980;
          if (current !== prev) {
            prev = current;
            setIsSplitScreen(current);
          }
        };
        window.addEventListener('resize', handleResize);
        const mql = window.matchMedia('(max-width: 980px)');
        const mqlHandler = (e) => setIsSplitScreen(e.matches);
        mql.addEventListener('change', mqlHandler);
        return () => {
          window.removeEventListener('resize', handleResize);
          mql.removeEventListener('change', mqlHandler);
        };
      }, []);

      useEffect(() => {
        return () => {
          if (hoverCloseTimer.current) clearTimeout(hoverCloseTimer.current);
          if (toastTimer.current) clearTimeout(toastTimer.current);
        };
      }, []);

      const clearHoverTimer = () => {
        if (hoverCloseTimer.current) {
          clearTimeout(hoverCloseTimer.current);
          hoverCloseTimer.current = null;
        }
      };

      const scheduleHoverClear = () => {
        clearHoverTimer();
        hoverCloseTimer.current = setTimeout(() => {
          setHoveredElementNum(null);
        }, 140);
      };

      const handleCellPointerEnter = (e, num) => {
        if (e.pointerType === 'touch') return;
        clearHoverTimer();
        setHoveredElementNum(num);
      };

      const handleCellPointerLeave = (e) => {
        if (e.pointerType === 'touch') return;
        scheduleHoverClear();
      };

      // Click selects the model and pins its card (it survives the cursor leaving);
      // clicking the same cell again unpins it.
      const handleCellClick = (e, num) => {
        e.stopPropagation();
        clearHoverTimer();
        setHoveredElementNum(null);
        setSelectedModel({ type: 'element', number: num });
        setPinnedElementNum((prev) => (prev === num ? null : num));
      };

      const handleSelectThinkingLevel = (num, level) => {
        setThinkingLevels((prev) => ({ ...prev, [num]: level }));
        setSelectedModel({ type: 'element', number: num });
      };

      const handleToggleTable = useCallback(() => {
        setIsLeftMenuOpen(false);
        setIsMoreUploadsOpen(false);
        setHoveredElementNum(null);
        setPinnedElementNum(null);
        setIsTableOpen((prev) => !prev);
      }, []);

      const handleToggleLeftMenu = () => {
        setIsTableOpen(false);
        setHoveredElementNum(null);
        setPinnedElementNum(null);
        setIsLeftMenuOpen((prev) => {
          if (prev) setIsMoreUploadsOpen(false);
          return !prev;
        });
      };

      const handleSuggestedPromptClick = (text) => {
        setPromptText(text);
        setIsTableOpen(false);
        setIsLeftMenuOpen(false);
        setIsMoreUploadsOpen(false);
        inputRef.current?.focus();
      };

      const handlePromptSubmit = (e) => {
        e.preventDefault();
        const trimmed = promptText.trim();
        if (!trimmed) return;
        const levelSuffix =
          selectedModel.type === 'element' && currentReleasedModels[selectedModel.number]
            ? ` · Thinking: ${thinkingLevels[selectedModel.number]}`
            : triggerDisplay.isComingSoon
            ? ' (Preview)'
            : '';
        const toolPrefix = activeTool ? `[${activeTool}] ` : '';
        showToast(`${toolPrefix}[${activeMode}] Ready for ${triggerDisplay.label}${levelSuffix}`);
        setPromptText('');
      };

      const handleMicClick = useCallback(() => {
        setIsListening((prev) => {
          const next = !prev;
          showToast(next ? 'Voice input listening...' : 'Voice input paused');
          return next;
        });
      }, [showToast]);

      // Global keyboard shortcuts matching hover tooltips: ^⇧M and ^⇧D
      useEffect(() => {
        const handleShortcuts = (e) => {
          if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) {
            if (e.code === 'KeyM') {
              e.preventDefault();
              handleToggleTable();
            } else if (e.code === 'KeyD') {
              e.preventDefault();
              handleMicClick();
            }
          }
        };
        document.addEventListener('keydown', handleShortcuts);
        return () => document.removeEventListener('keydown', handleShortcuts);
      }, [handleToggleTable, handleMicClick]);

      const handleFilesSelected = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0) {
          const summary = files.length === 1 ? files[0].name : `${files.length} files selected`;
          showToast(`Attached: ${summary}`);
        }
        e.target.value = '';
        setIsLeftMenuOpen(false);
        setIsMoreUploadsOpen(false);
      };

      const handleSelectLeftTool = (toolId) => {
        setActiveTool((prev) => (prev === toolId ? null : toolId));
        setIsLeftMenuOpen(false);
        setIsMoreUploadsOpen(false);
        inputRef.current?.focus();
      };

      const modeConfig = MODE_CONFIG[activeMode];

      return (
        <main className="stage">
          <div className={`ambient-glow lm-glow is-${activeMode.toLowerCase()}`} aria-hidden="true">
            <div className="ambient-glow-backdrop ambient-backdrop-chat" />
            <div className="ambient-glow-backdrop ambient-backdrop-task" />
            <div className="ambient-glow-layer ambient-glow-chat" />
            <div className="ambient-glow-layer ambient-glow-task" />
          </div>

          <header className="top-header" ref={topHeaderRef}>
            <div className="top-header-left">
              <button
                type="button"
                className="top-header-btn"
                aria-label="Main menu"
                onClick={() => showToast('Main menu placeholder')}
              >
                <HamburgerIcon />
              </button>
              <div className={`tooltip-wrap ${isTableOpen ? 'is-suppressed' : ''}`}>
                <button
                  type="button"
                  className={`model-trigger ${isTableOpen ? 'is-open' : ''}`}
                  aria-expanded={isTableOpen}
                  aria-haspopup="dialog"
                  onClick={handleToggleTable}
                >
                  {triggerDisplay.isComingSoon && <span className="dot-ring coming-soon-ring" />}
                  <span>{triggerDisplay.label}</span>
                  {triggerDisplay.thinkingLabel && (
                    <span className="model-trigger-level">{triggerDisplay.thinkingLabel}</span>
                  )}
                  <ChevronDownIcon className="chevron" />
                </button>
                <span className="bar-tooltip" role="tooltip">
                  Switch model (^⇧M)
                </span>
              </div>
            </div>
          </header>

          <div className="main-container">
            <div className="greeting-wrap">
              <GreetingSparkle />
              <h1 className="greeting">
                {modeConfig.greeting}
              </h1>
            </div>

            {/* Prompt Bar, Left Menu & Periodic Table Popover Anchor */}
            <div className="prompt-anchor" ref={anchorRef}>
              <form className="prompt-bar" onSubmit={handlePromptSubmit}>
                <button
                  type="button"
                  className={`icon-circle-btn ${isLeftMenuOpen ? 'is-open' : ''}`}
                  aria-label={isLeftMenuOpen ? 'Close tools and upload menu' : 'Open tools and upload menu'}
                  aria-expanded={isLeftMenuOpen}
                  aria-haspopup="menu"
                  onClick={handleToggleLeftMenu}
                >
                  <PlusIcon className="plus-to-close" />
                </button>

                {activeTool && (
                  <span className="active-tool-chip">
                    <ToolIcon tool={activeTool} />
                    <span>{TOOL_SHORT_LABELS[activeTool] || activeTool}</span>
                    <button
                      type="button"
                      className="active-tool-clear"
                      aria-label={`Remove ${TOOL_SHORT_LABELS[activeTool] || activeTool}`}
                      onClick={() => setActiveTool(null)}
                    >
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                      </svg>
                    </button>
                  </span>
                )}

                <input
                  ref={inputRef}
                  type="text"
                  className="prompt-input"
                  placeholder={modeConfig.placeholder}
                  aria-label={modeConfig.placeholder}
                  value={promptText}
                  onChange={(e) => setPromptText(e.target.value)}
                />

                <div className="prompt-right">
                  <div className={`tooltip-wrap model-trigger-wrap ${isTableOpen ? 'is-suppressed' : ''}`}>
                    <button
                      type="button"
                      className={`model-trigger ${isTableOpen ? 'is-open' : ''}`}
                      aria-expanded={isTableOpen}
                      aria-haspopup="dialog"
                      onClick={handleToggleTable}
                    >
                      {triggerDisplay.isComingSoon && <span className="dot-ring coming-soon-ring" />}
                      <span>{triggerDisplay.label}</span>
                      {triggerDisplay.thinkingLabel && (
                        <span className="model-trigger-level">{triggerDisplay.thinkingLabel}</span>
                      )}
                      <ChevronDownIcon className="chevron" />
                    </button>
                    <span className="bar-tooltip" role="tooltip">
                      Switch model (^⇧M)
                    </span>
                  </div>

                  <div className="tooltip-wrap">
                    <button
                      type="button"
                      className={`icon-circle-btn ${isListening ? 'is-listening' : ''}`}
                      aria-label="Dictate"
                      onClick={handleMicClick}
                    >
                      <MicIcon />
                    </button>
                    <span className="bar-tooltip is-right-aligned" role="tooltip">
                      Dictate (^⇧D)
                    </span>
                  </div>
                </div>
              </form>

              <input
                ref={fileInputRef}
                type="file"
                multiple
                hidden
                onChange={handleFilesSelected}
              />

              {/* Left Action Menu */}
              {isLeftMenuOpen && (
                <div className="left-menu" role="menu" aria-label="Uploads and creative tools">
                  <button
                    type="button"
                    className="left-menu-item"
                    role="menuitem"
                    onClick={() => fileInputRef.current?.click()}
                  >
                    <PaperclipIcon />
                    <span>Upload files</span>
                  </button>

                  <button
                    type="button"
                    className="left-menu-item"
                    role="menuitem"
                    onClick={() => {
                      setIsLeftMenuOpen(false);
                      setIsMoreUploadsOpen(false);
                      showToast('Web drive browser placeholder');
                    }}
                  >
                    <NasIcon />
                    <span>Add from web drive</span>
                  </button>

                  <div
                    className="more-uploads-wrap"
                    onMouseEnter={() => setIsMoreUploadsOpen(true)}
                    onMouseLeave={() => setIsMoreUploadsOpen(false)}
                  >
                    <button
                      type="button"
                      className={`left-menu-item ${isMoreUploadsOpen ? 'is-active' : ''}`}
                      role="menuitem"
                      aria-expanded={isMoreUploadsOpen}
                      onClick={(e) => {
                        e.stopPropagation();
                        setIsMoreUploadsOpen((prev) => !prev);
                      }}
                    >
                      <DotsHorizontalIcon />
                      <span>More uploads</span>
                      <ChevronRightIcon className={isMoreUploadsOpen ? 'is-open' : ''} />
                    </button>

                    {isMoreUploadsOpen && (
                      <div className="left-submenu" role="menu" aria-label="More upload sources">
                        {MORE_UPLOAD_OPTIONS.map((opt) => (
                          <button
                            key={opt.id}
                            type="button"
                            className="left-menu-item"
                            role="menuitem"
                            onClick={(e) => {
                              e.stopPropagation();
                              setIsLeftMenuOpen(false);
                              setIsMoreUploadsOpen(false);
                              showToast(`${opt.label} placeholder`);
                            }}
                          >
                            <span>{opt.label}</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="left-menu-divider" role="separator" />

                  {LEFT_MENU_TOOLS.map((tool) => (
                    <button
                      key={tool.id}
                      type="button"
                      className={`left-menu-item ${activeTool === tool.id ? 'is-active' : ''}`}
                      role="menuitem"
                      onClick={() => handleSelectLeftTool(tool.id)}
                    >
                      {tool.icon}
                      <span>{tool.label}</span>
                    </button>
                  ))}

                  <button
                    type="button"
                    className="left-menu-item"
                    role="menuitemcheckbox"
                    aria-checked={personalIntel}
                    onClick={() => setPersonalIntel((prev) => !prev)}
                  >
                    <PersonalIntelIcon />
                    <span className="left-menu-label">
                      <span>Personal Intelligence</span>
                      <span className="left-menu-sub">Labs</span>
                    </span>
                    <span className={`labs-switch ${personalIntel ? 'is-on' : ''}`} aria-hidden="true">
                      <span className="labs-switch-thumb">
                        {personalIntel && <CheckSmallIcon />}
                      </span>
                    </span>
                  </button>
                </div>
              )}

              {/* Model Periodic Table Panel */}
              {isTableOpen && (
                <section
                  ref={panelRef}
                  className="periodic-panel"
                  role="dialog"
                  aria-label="Model periodic table"
                  onClick={() => setPinnedElementNum(null)}
                >
                  {/* Top Bar */}
                  <div className="panel-header">
                    <div className="panel-title-group">
                      <SparkleIcon />
                      <span>Model periodic table</span>
                    </div>
                    <input
                      type="search"
                      className="panel-search"
                      placeholder="Search element or number"
                      aria-label="Search elements"
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Escape' && query) {
                          e.stopPropagation();
                          setQuery('');
                        }
                      }}
                    />
                    <button
                      type="button"
                      className="panel-close-btn"
                      aria-label="Close model periodic table"
                      onClick={() => {
                        setIsTableOpen(false);
                        setHoveredElementNum(null);
                        setPinnedElementNum(null);
                      }}
                    >
                      <CloseIcon />
                    </button>
                  </div>

                  {/* Periodic Grid */}
                  <div className="periodic-grid-scroll">
                    <div className="periodic-grid">
                      {/* Group numbers 1-18 */}
                      {Array.from({ length: 18 }, (_, i) => i + 1).map((groupNum) => (
                        <div
                          key={`group-${groupNum}`}
                          className="group-label"
                          style={{ gridColumn: groupNum + 1, gridRow: 1 }}
                        >
                          {groupNum}
                        </div>
                      ))}

                      {/* Period numbers 1-7 */}
                      {Array.from({ length: 7 }, (_, i) => i + 1).map((periodNum) => (
                        <div
                          key={`period-${periodNum}`}
                          className="period-label"
                          style={{ gridColumn: 1, gridRow: periodNum + 1 }}
                        >
                          {periodNum}
                        </div>
                      ))}

                      {/* Placeholder markers for Lanthanides (57-71) and Actinides (89-103) */}
                      <div
                        className="el-range-marker"
                        style={{ gridColumn: 4, gridRow: 7 }}
                        onMouseEnter={() => setHoveredSeries('lanthanides')}
                        onMouseLeave={() => setHoveredSeries(null)}
                        title="Lanthanides (57 La – 71 Lu)"
                      >
                        57-71
                      </div>
                      <div
                        className="el-range-marker"
                        style={{ gridColumn: 4, gridRow: 8 }}
                        onMouseEnter={() => setHoveredSeries('actinides')}
                        onMouseLeave={() => setHoveredSeries(null)}
                        title="Actinides (89 Ac – 103 Lr)"
                      >
                        89-103
                      </div>

                      {/* Labels for the detached lanthanide / actinide rows */}
                      <div
                        className="series-label"
                        style={{ gridRow: 10 }}
                        onMouseEnter={() => setHoveredSeries('lanthanides')}
                        onMouseLeave={() => setHoveredSeries(null)}
                      >
                        Lanthanides
                      </div>
                      <div
                        className="series-label"
                        style={{ gridRow: 11 }}
                        onMouseEnter={() => setHoveredSeries('actinides')}
                        onMouseLeave={() => setHoveredSeries(null)}
                      >
                        Actinides
                      </div>

                      {/* 118 Chemical Elements */}
                      {ELEMENTS.map((el) => {
                        const releaseInfo = currentReleasedModels[el.number];
                        const isReleased = Boolean(releaseInfo);
                        const isSelected =
                          selectedModel.type === 'element' && selectedModel.number === el.number;
                        const isHovered =
                          hoveredElementNum === el.number || pinnedElementNum === el.number;
                        const isSeriesHighlight =
                          (hoveredSeries === 'lanthanides' && el.row === 9) ||
                          (hoveredSeries === 'actinides' && el.row === 10);

                        const gridRow = el.row + 1;
                        const gridCol = el.col + 1;

                        const isMatch = Boolean(q) && matchesQuery(el);
                        const isDimmed = Boolean(q) && !isMatch;

                        const cellStyle = isReleased
                          ? {
                              gridColumn: gridCol,
                              gridRow,
                              backgroundColor: releaseInfo.themeColor,
                              borderColor:
                                isSelected || isHovered
                                  ? releaseInfo.hoverBorderColor
                                  : releaseInfo.borderColor,
                              boxShadow: isSelected
                                ? `0 0 0 1px ${releaseInfo.activeBorder}, 0 0 14px ${releaseInfo.glowColor}`
                                : undefined,
                            }
                          : {
                              gridColumn: gridCol,
                              gridRow,
                            };

                        return (
                          <button
                            key={el.number}
                            ref={(node) => {
                              if (node) cellRefs.current[el.number] = node;
                            }}
                            type="button"
                            className={[
                              'el-cell',
                              isReleased ? 'is-released' : 'is-coming-soon',
                              isSelected ? 'is-selected' : '',
                              isHovered ? 'is-hovered' : '',
                              isSeriesHighlight ? 'is-series-highlight' : '',
                              isMatch ? 'is-match' : '',
                              isDimmed ? 'is-dimmed' : '',
                            ]
                              .filter(Boolean)
                              .join(' ')}
                            style={cellStyle}
                            aria-label={`${el.number} ${el.name}${isReleased ? ' (Released)' : ' (Coming soon)'}`}
                            aria-pressed={isSelected}
                            onPointerEnter={(e) => handleCellPointerEnter(e, el.number)}
                            onPointerLeave={handleCellPointerLeave}
                            onFocus={(e) => {
                              if (e.target.matches(':focus-visible')) {
                                clearHoverTimer();
                                setHoveredElementNum(el.number);
                              }
                            }}
                            onBlur={(e) => {
                              if (e.relatedTarget && e.relatedTarget.closest?.('.element-popover')) return;
                              if (e.target.matches(':focus-visible')) {
                                scheduleHoverClear();
                              }
                            }}
                            onClick={(e) => handleCellClick(e, el.number)}
                          >
                            <span className="el-num">{el.number}</span>
                            <span className="el-sym">{el.symbol}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Footer: currently selected model */}
                  {(() => {
                    const selEl = ELEMENTS_BY_NUMBER[selectedModel.number];
                    const selInfo = currentReleasedModels[selectedModel.number];
                    return (
                      <div className="panel-footer" aria-live="polite">
                        <span className="footer-model">
                          {selInfo ? (
                            <span className="footer-dot" style={{ background: selInfo.activeBorder }} />
                          ) : (
                            <span className="dot-ring" />
                          )}
                          {selEl.name}
                        </span>
                        {selInfo && (
                          <span className="footer-meta">Thinking · {thinkingLevels[selectedModel.number]}</span>
                        )}
                      </div>
                    );
                  })()}

                  {/* One popover instance: a light preview while hovering, expands in place
                      into the full card once its cell is clicked (stays after the cursor leaves) */}
                  {activePopoverNum && (
                    <ElementPopover
                      mode={activePopoverNum === pinnedElementNum ? 'pinned' : 'hover'}
                      element={ELEMENTS_BY_NUMBER[activePopoverNum]}
                      releaseInfo={currentReleasedModels[activePopoverNum]}
                      thinkingLevel={thinkingLevels[activePopoverNum]}
                      panelRef={panelRef}
                      getCellEl={() => cellRefs.current[activePopoverNum]}
                      onSelectThinkingLevel={handleSelectThinkingLevel}
                    />
                  )}
                </section>
              )}
            </div>

            {/* Mode Segmented Control & Suggested Prompts */}
            <div className="lower-content">
              <div className={`segmented-control is-${activeMode.toLowerCase()}`} role="tablist" aria-label="Interaction mode">
                <div className="segmented-slider" aria-hidden="true" />
                {MODES.map((mode) => (
                  <button
                    key={mode}
                    type="button"
                    role="tab"
                    aria-selected={activeMode === mode}
                    className={`segment-btn ${activeMode === mode ? 'is-active' : ''}`}
                    onClick={() => setActiveMode(mode)}
                  >
                    {mode}
                  </button>
                ))}
              </div>

              <div className="suggested-list">
                {modeConfig.prompts.map((item) => (
                  <button
                    key={item.id}
                    type="button"
                    className="suggested-item"
                    onClick={() => handleSuggestedPromptClick(item.text)}
                  >
                    <SuggestedIcon type={item.icon} />
                    <span>{item.text}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {toast && (
            <div className="prototype-toast" role="status" aria-live="polite">
              <span>{toast}</span>
            </div>
          )}
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
